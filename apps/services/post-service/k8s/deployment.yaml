apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  namespace: default
  labels:
    app: post-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
      # Anotações no template do POD: é o que o job `kubernetes-pods` do
      # monitoring/prometheus.yml lê para descobrir o alvo. Entraram junto com a
      # integração ao post-validation-service porque `post_validation_total` —
      # a métrica que decide quando virar POST_VALIDATION_MODE de `warn` para
      # `block` — vive aqui e, sem scrape, o rollout seria às cegas. Como efeito,
      # as demais métricas que o serviço já expunha em /metrics passam a ser
      # coletadas também (todas com cardinalidade controlada; ver "Infra" no
      # CLAUDE.md do serviço).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 60
      volumes:
        - name: astra-bundle
          secret:
            secretName: astra-secure-connect-bundle
      containers:
        - name: post-service
          image: ghcr.io/victormarchidev/vibester-post-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: post-service-secret
            - configMapRef:
                name: redis-env
          env:
            - name: ASTRA_SECURE_CONNECT_BUNDLE
              value: /etc/astra/secure-connect-bundle.zip
            # post-validation-service. Nao e segredo: e endereco de Service
            # interno e politica de enforcement, ambos versionados aqui de
            # proposito, para que virar `warn`/`block` seja um diff revisavel.
            - name: POST_VALIDATION_URL
              value: http://post-validation-service:3008
            - name: POST_VALIDATION_TIMEOUT_MS
              value: "1000"
            # `warn` no primeiro deploy: consulta e mede, mas nao barra.
            # Acompanhe post_validation_total{result="invalid"} por alguns dias
            # e, quando a taxa nao for falso positivo da blocklist, troque para
            # "block" neste arquivo — o CI aplica o manifest, entao a troca e um
            # diff revisavel. Ligar direto em `block` faz todo falso positivo
            # virar publicacao recusada no primeiro minuto.
            - name: POST_VALIDATION_MODE
              value: "warn"
            # Executa a ocultacao pedida pela moderacao de imagem. A alavanca de
            # rollout e o IMAGE_MODERATION_MODE do worker de validacao (em
            # `observe`, nenhum pedido chega aqui); isto e o freio de emergencia.
            - name: POST_MODERATION_HIDE
              value: "on"
          volumeMounts:
            - name: astra-bundle
              mountPath: /etc/astra
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
